<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rabbithole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Nunito:wght@500;700&display=swap">
<style>
:root{--bg:#d9f1ff;--ink:#231f4a;--panel:#ffffff;--muted:#5b5788;--soil:#8a5a3c;--carrot:#ff8a1f;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1838;--ink:#f3f0ff;--panel:#2b2758;--muted:#b9b3ee}}
:root[data-theme="dark"]{--bg:#1b1838;--ink:#f3f0ff;--panel:#2b2758;--muted:#b9b3ee}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:500 17px/1.5 Nunito,system-ui,sans-serif;min-height:100vh}
main{max-width:640px;margin:0 auto;padding:18px 16px 60px}
h1,h2,h3,button,.pill{font-family:Fredoka,"Trebuchet MS",sans-serif}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px}
.logo{font:700 24px Fredoka,sans-serif;background:none;border:0;color:var(--ink);cursor:pointer;padding:4px}
.pill{background:var(--panel);border-radius:999px;padding:4px 12px;font-weight:600;font-size:15px}
.hero{text-align:center;padding:28px 0 10px}
.bun{font-size:84px;display:inline-block;animation:hop 1.6s ease-in-out infinite;transform-origin:bottom}
@keyframes hop{0%,55%,100%{transform:translateY(0)}25%{transform:translateY(-22px) rotate(-6deg)}}
@media (prefers-reduced-motion:reduce){.bun{animation:none}}
h1{font-size:clamp(34px,9vw,52px);line-height:1.05;margin:6px 0 8px}
.sub{color:var(--muted);margin:0 auto 20px;max-width:30ch}
form{display:flex;gap:8px;background:var(--panel);padding:8px;border-radius:999px;box-shadow:0 6px 0 var(--carrot)}
input{flex:1;min-width:0;border:0;background:none;font:600 18px Nunito,sans-serif;color:var(--ink);padding:8px 14px;outline:none}
button{cursor:pointer;border:0;font-weight:600}
.go{background:var(--carrot);color:#231f4a;border-radius:999px;padding:10px 18px;font-size:17px}
button:focus-visible,input:focus-visible{outline:3px solid var(--carrot);outline-offset:2px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:16px}
.chip{background:var(--panel);color:var(--ink);border-radius:999px;padding:7px 14px;font-size:16px}
.modes{display:flex;gap:4px;margin:10px 0 4px;background:rgba(255,255,255,.45);padding:4px;border-radius:999px;position:sticky;top:4px;z-index:4;backdrop-filter:blur(8px)}
.mode{flex:1;background:transparent;color:var(--ink);border-radius:999px;padding:7px 8px;font:600 15px Fredoka,sans-serif;transition:.18s ease}.mode.active{background:var(--panel);box-shadow:0 2px 0 var(--soil)}.mode:focus-visible{outline:3px solid var(--carrot);outline-offset:1px}
.resources{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}.resource{flex:1;min-width:145px;background:rgba(255,255,255,.72);color:#231f4a;border-radius:16px;padding:10px 12px;font:600 15px/1.25 Nunito,sans-serif}.resource b{font-family:Fredoka,sans-serif;font-size:17px;display:block;margin-bottom:2px}
.bubble{background:var(--panel);border-radius:20px 20px 20px 4px;padding:10px 14px;margin:16px 0;display:flex;gap:10px;align-items:center}
.bubble span:first-child{font-size:30px}
.trail{display:flex;flex-wrap:wrap;gap:4px 6px;align-items:center;margin:14px 0;font-size:15px;color:var(--muted)}
.trail b{background:var(--panel);color:var(--ink);border-radius:999px;padding:2px 10px;font-weight:700}
.reveal{background:var(--panel);border-radius:26px;padding:20px;border-bottom:8px solid var(--soil)}
.reveal .big{font-size:56px;line-height:1}
h2{font-size:30px;margin:6px 0 8px}
.src{color:var(--muted);font-size:14px;margin:8px 0 0}
h3.next{font-size:22px;margin:26px 0 10px}
.card{border-radius:24px;padding:16px 18px 18px;margin:0 0 14px;color:#231f4a}
.card:nth-of-type(3n+1){background:#ff9fca;transform:rotate(-.6deg)}
.card:nth-of-type(3n+2){background:#8fd4ff;transform:rotate(.5deg)}
.card:nth-of-type(3n){background:#c3f570;transform:rotate(-.3deg)}
.card h3{font-size:24px;margin:0 0 6px}
.card p{margin:0 0 8px}
.fact{background:rgba(255,255,255,.6);border-radius:14px;padding:10px 12px}
.why{font-size:15px}
.dig{background:#231f4a;color:#fff;border-radius:999px;padding:10px 16px;font-size:16px;width:100%;margin-top:4px}
.toast{position:fixed;left:50%;bottom:calc(16px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--carrot);color:#231f4a;font:600 16px Fredoka,sans-serif;border-radius:999px;padding:10px 18px;width:max-content;max-width:92vw;text-align:center}
[hidden]{display:none!important}
.word{background:none;border:0;padding:0;font:inherit;font-weight:700;color:inherit;cursor:pointer;-webkit-text-decoration:underline wavy var(--carrot);text-decoration:underline wavy var(--carrot);text-underline-offset:4px;text-decoration-thickness:2px}
.sheet{position:fixed;left:0;right:0;bottom:0;margin:0 auto;max-width:640px;background:#ffe66d;color:#231f4a;border-radius:26px 26px 0 0;padding:18px 18px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:0 -6px 0 var(--carrot);animation:up .25s ease-out;z-index:5}
.sheet h3{font-size:24px;margin:0 0 6px}.sheet p{margin:0 0 12px}
.sheet .row{display:flex;flex-direction:column;gap:8px}
.shut{background:rgba(35,31,74,.12);color:#231f4a;border-radius:999px;padding:10px 16px;font-size:16px}
@keyframes up{from{transform:translateY(40px);opacity:0}}
@media (prefers-reduced-motion:reduce){.sheet{animation:none}}
.hook{font:600 19px/1.35 Nunito,sans-serif;margin:0 0 8px}
.reveal .hook{font-size:21px}
.deeper{background:var(--carrot);color:#231f4a;border-radius:999px;padding:9px 16px;font-size:16px;margin-top:4px}
.more{border-top:2px dashed var(--muted);margin-top:10px;padding-top:10px}
.pills{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
button.pill{border:0;color:var(--ink);cursor:pointer}
.fox{position:fixed;top:0;right:0;bottom:0;left:0;z-index:20;display:flex;align-items:center;justify-content:center;background:rgba(20,10,40,.82);padding:calc(16px + env(safe-area-inset-top,0px)) 16px calc(16px + env(safe-area-inset-bottom,0px));overflow:auto}
.fbox{background:#ffb55e;color:#231f4a;border-radius:28px;padding:20px;max-width:520px;width:100%;box-shadow:0 8px 0 #c4561a}
.face{font-size:72px;line-height:1;text-align:center;animation:wob 1.2s ease-in-out infinite}
@keyframes wob{50%{transform:rotate(-6deg) scale(1.06)}}
@media (prefers-reduced-motion:reduce){.face{animation:none}}
.fsay{font:600 18px/1.3 Fredoka,sans-serif;text-align:center;margin:8px 0}
.fbox h3{font-size:20px;margin:6px 0 10px}
.bar{height:10px;border-radius:99px;background:rgba(35,31,74,.2);overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:100%;background:#c4561a}
.opt{display:block;width:100%;text-align:left;background:#fff;color:#231f4a;border-radius:16px;padding:12px 14px;margin:8px 0;font:600 16px/1.35 Nunito,sans-serif}
.nom{display:block;font:700 24px Fredoka,sans-serif;margin-top:6px}
.weblink{display:inline-block;background:var(--carrot);color:#231f4a;border-radius:999px;padding:10px 18px;font:600 17px Fredoka,sans-serif;text-decoration:none;margin-top:14px}
.acts2{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:4px}
a.wiki{border:2px solid var(--ink);color:var(--ink);border-radius:999px;padding:7px 14px;font:600 16px Fredoka,sans-serif;text-decoration:none}
.bits{margin:4px 0 8px;padding-left:20px}
.bits li{margin:4px 0}
html{-webkit-text-size-adjust:100%}
button,input{-webkit-appearance:none;appearance:none}
input{border-radius:0;-webkit-tap-highlight-color:transparent}
button,a{-webkit-tap-highlight-color:transparent}
</style>
</head>
<body>
<main>
  <div class="top">
    <button class="logo" id="home" aria-label="Back to start">🐇 Rabbithole</button>
    <div class="pills"><span class="pill" id="lives" hidden></span><span class="pill" id="carrots" hidden>🥕 0</span><button class="pill" id="foxbtn" aria-pressed="true">🦊 on</button></div>
  </div>
  <div class="modes" aria-label="Choose your Rabbithole mode">
    <button class="mode" data-mode="bunny" aria-pressed="false">🐰 <span>Bunny</span></button>
    <button class="mode active" data-mode="rabbit" aria-pressed="true">🐇 <span>Rabbit</span></button>
    <button class="mode" data-mode="owl" aria-pressed="false">🦉 <span>Owl</span></button>
  </div>
  <div id="app"></div>
</main>
<aside class="sheet" id="sheet" hidden></aside>
<div class="fox" id="fox" role="dialog" aria-modal="true" aria-labelledby="fq" hidden></div>
<div class="toast" id="toast" role="status" hidden></div>
<script>
const MODE={mode:'rabbit'};
const MODE_INFO={bunny:{note:'Simple & playful — short facts, easy words and little surprises.',fox:false},rabbit:{note:'Curious & detailed — the full Rabbithole experience.',fox:true},owl:{note:'Deep & technical — longer explanations and proper terms.',fox:true}};
const BUNNY={cats:'Cats can sleep for 12 to 16 hours a day.',egypt:'Ancient Egypt was a huge country by the River Nile. People there loved cats.',domestic:'Long ago, cats came near farms because mice ate the farmers’ food. The cats caught the mice.',eyes:'Cats have a shiny layer behind their eyes. It helps them see when it is dark.',writing:'Some of the first writing was used to keep track of food, like grain and beer.',crypto:'People have been hiding messages for a very long time. Codes can turn a secret message into a puzzle.',info:'Information is something that tells you something new. A surprise can carry lots of information.',turing:'Alan Turing helped invent ideas that led to modern computers.',octopus:'Octopuses have three hearts and blue blood. Their arms can do lots of things by themselves.',dna:'DNA is like a tiny set of instructions inside living things.',ai:'AI means making computers do things that seem clever, like spotting patterns or answering questions.',bees:'Honeybees dance to show other bees where to find flowers.',nav:'People can find their way using stars, the Sun, the sea and other clues.',stars:'Stars are huge balls of hot gas. The Sun is a star too.',gold:'Some of the gold on Earth may have been made when two dead stars crashed together.',volcano:'A volcano can send ash high into the sky. A huge eruption can even cool the Earth for a while.',frank:'Mary Shelley wrote Frankenstein when she was very young. It became a famous monster story.',elec:'Electricity can make muscles move. Scientists discovered this by doing experiments with animal muscles.',cheese:'Cheese is made from milk. Making cheese helps it last longer than fresh milk.',fungi:'Fungi include mushrooms and moulds. They help break down dead plants and animals.',zero:'Zero means “nothing”. It became a very important number for maths.',music:'Music can make your brain feel excited before your favourite part even starts.',sleep:'People sleep every day. Some animals sleep in very strange ways.',time:'Long ago, different towns used different times. Trains helped people agree on standard times.',chocolate:'The first chocolate drinks were bitter, not sweet like many chocolate bars today.',moon:'The Moon is slowly moving away from Earth.',lang:'Some people can speak by whistling. The whistles can carry across valleys.',bats:'Bats can use echoes to find things in the dark. They are the only mammals that can truly fly.',elephant:'Elephants can use mirrors to help recognise themselves.',birdnav:'Some birds may be able to sense Earth’s magnetic field to help them find their way.',cooking:'Cooking changes food and can make it easier for our bodies to use.',rainbow:'A rainbow is made when sunlight and raindrops work together.',glass:'Glass can be made from sand. Volcanoes can make natural glass too.',chili:'Chillies can feel hot to people because of a chemical called capsaicin.',gps:'GPS uses signals from satellites to work out where you are.',honey:'Bees turn flower nectar into honey. Honey can last for a very long time.',ants:'Some ants live in huge groups and work together.',microbes:'Tiny living things called microbes live on and inside us. Many are helpful.',colour:'Some animals look blue because of the way light bounces off tiny structures.',saturn:'Saturn has beautiful rings made mostly of ice.'};
const BUNNY_HOOK={cats:'Why do cats sleep so much?',egypt:'Why did people in Egypt care so much about cats?',domestic:'Did cats choose to live with people?',eyes:'Why do cat eyes shine at night?',writing:'How did people first write things down?',crypto:'How can you hide a message?',info:'What makes something surprising?',turing:'How did we get from ideas to computers?',octopus:'How can an animal have three hearts?',dna:'How can so much information fit inside a tiny cell?',ai:'How can a computer seem clever?',bees:'How can a dance show where flowers are?',nav:'How did people find their way before maps and phones?',stars:'Why can we see stars from so far away?',gold:'Where did the gold in the ground come from?',volcano:'How can a volcano change the weather?',frank:'How did a rainy holiday help create a monster story?',elec:'How can electricity make muscles move?',cheese:'Why turn milk into cheese?',fungi:'What do mushrooms and moulds do?',zero:'How did people invent zero?',music:'Why can music give you goosebumps?',sleep:'Why do we need to sleep?',time:'Why did trains change clocks?',chocolate:'What was chocolate like long ago?',moon:'Is the Moon really moving away?',lang:'Can you talk by whistling?',bats:'How can bats “see” with sound?',elephant:'Can elephants recognise themselves?',birdnav:'How can a bird find its way?',cooking:'Why do we cook food?',rainbow:'Where do rainbows come from?',glass:'How do we make glass?',chili:'Why do chillies feel hot?',gps:'How does your phone know where you are?',honey:'Why does honey last so long?',ants:'How do ants work together?',microbes:'What are the tiny helpers living with us?',colour:'How can something look blue without blue paint?',saturn:'What are Saturn’s rings made of?'};
function modeFact(id,n){return MODE.mode==='bunny'?(BUNNY[id]||n.f):(MODE.mode==='owl'?n.d:n.f)}
function modeHook(id,n){return MODE.mode==='bunny'?(BUNNY_HOOK[id]||n.f):(MODE.mode==='owl'?(H[id]||n.d):(H[id]||n.f))}
function printable(kind,id){const n=N[id];const body=kind==='colour'?`<h1>${n.e} ${n.t}</h1><p>Colour this page, then tell someone one thing you learned.</p><div style="font-size:190px;text-align:center;margin:60px 0">${n.e}</div><hr><hr><hr>`:`<h1>${n.e} ${n.t}</h1><p><b>Quick fact:</b> ${modeFact(id,n)}</p><h2>Try these</h2><ol><li>What is the main thing you remember?</li><li>What surprised you?</li><li>What would you ask next?</li><li>Draw or label something from this topic.</li></ol><h2>One-sentence summary</h2><hr><hr>`;const w=window.open('','_blank');if(!w)return toast('Please allow pop-ups to print your sheet.');w.document.write(`<!doctype html><html><head><title>${n.t}</title><style>body{font-family:Arial,sans-serif;padding:40px;max-width:760px;margin:auto;color:#231f4a}h1{font-size:34px}h2{margin-top:30px}hr{margin:35px 0;border:0;border-bottom:2px solid #999}@media print{body{padding:20px}}</style></head><body>${body}<script>setTimeout(()=>window.print(),300)<\/script></body></html>`);w.document.close()}
function updateModeUI(){document.querySelectorAll('.mode').forEach(b=>{const on=b.dataset.mode===MODE.mode;b.classList.toggle('active',on);b.setAttribute('aria-pressed',on)});const f=$('foxbtn');if(f){S.fox=MODE_INFO[MODE.mode].fox;f.textContent=S.fox?'🦊 on':'🦊 off';f.setAttribute('aria-pressed',S.fox)}}
const N={
cats:{k:'cat kitten',e:'🐱',t:'Cats',f:'Cats can sleep 12 to 16 hours a day.',d:'Domestic cats descend from the African wildcat and have lived alongside people for thousands of years. They are ambush hunters with superb night vision, and that is exactly where the tunnels start.',s:'Wikipedia: Cat',n:[['egypt','Cats were woven into Egyptian religion and daily life.'],['domestic','How did a solitary hunter end up on your sofa?'],['eyes','Cats see in the dark, and the trick is built into the eye.']]},
egypt:{k:'egypt pharaoh',e:'🏺',t:'Ancient Egypt',f:'The Greek historian {{herodotus|Herodotus}} reported that Egyptian households shaved their eyebrows in mourning when a cat died.',d:'Egyptian civilisation grew along the Nile and lasted over 3,000 years. Cats were linked to the goddess {{bastet|Bastet}}, and harming one was treated very seriously. Egypt also gave the world some of its earliest writing.',s:'Wikipedia: Cats in ancient Egypt',n:[['writing','Egypt developed one of the world\'s earliest writing systems.'],['domestic','Egyptian grain stores are where the cat and human deal may have begun.'],['gold','Egyptians treated gold as divine, and Tutankhamun\'s tomb was full of it.']]},
domestic:{k:'domestic',e:'🌾',t:'Cats domesticating themselves',f:'Cats mostly domesticated themselves: they likely moved in to hunt the mice raiding early farmers\' grain.',d:'Genetic studies suggest wildcats began hanging around early farming settlements. Mice ate the grain, cats ate the mice, and humans noticed. Unlike dogs, cats were never really bred for a job. They just stayed.',s:'Wikipedia: Cat',n:[['egypt','Egypt\'s grain stores helped spread the cat far and wide.'],['dna','Cat DNA lets scientists read that story backwards.'],['cheese','The same farming revolution gave us dairy.']]},
eyes:{k:'eye',e:'👁️',t:'Eyes that glow in the dark',f:'Cat eyes have a built-in mirror behind the retina that gives light a second chance to be seen.',d:'The mirror is called the {{tapetum|tapetum lucidum}}. It bounces light back through the retina, which is why eyes glow in headlights. Octopus eyes are wonderfully different: they evolved separately, and have no blind spot.',s:'Wikipedia: Tapetum lucidum',n:[['octopus','Octopus eyes evolved on a totally separate branch of life.'],['stars','Eyes catch light, and starlight is very old light.']]},
writing:{k:'writing hieroglyph',e:'✍️',t:'Writing',f:'Some of the earliest known writing is basically accounting: receipts for grain and beer.',d:'Early writing often began as tallies of goods. Stories and letters came later. Once words could sit still on clay or {{papyrus|papyrus}}, knowledge could outlive the person who had it.',s:'Wikipedia: History of writing',n:[['info','Writing made information persistent, so it could be stored and sent.'],['crypto','The moment you can write a message, somebody wants to hide one.'],['zero','Zero is one of the biggest inventions in the history of writing numbers.']]},
crypto:{k:'crypto cipher code enigma',e:'🔐',t:'Codes and ciphers',f:'A three-rotor {{enigma|Enigma machine}} had about 159 {{quintillion|quintillion}} possible settings.',d:'Secret writing is almost as old as writing. Enigma scrambled letters with rotors that moved on every keypress. Allied codebreakers still cracked it, using maths, operator mistakes and early machines.',s:'Wikipedia: Enigma machine',n:[['turing','Alan Turing helped break Enigma.'],['info','Every cipher is really a game about information.'],['lang','Codes are language in disguise.']]},
info:{k:'information',e:'📡',t:'Information',f:'In 1948 {{shannon|Claude Shannon}} showed information can be measured, and one fair coin flip is exactly one "{{bit|bit}}".',d:'Shannon\'s big idea: information is about surprise. A message you could already guess carries almost none. That idea sits under everything from zip files to phone signals, and even DNA.',s:'Wikipedia: Information theory',n:[['turing','Turing imagined the machine that would process it all.'],['dna','Life stored information long before we did.'],['music','Music is patterns and surprise, which is Shannon\'s idea in action.']]},
turing:{k:'turing',e:'🧠',t:'Alan Turing',f:'Turing described a general-purpose computer on paper in 1936, years before anyone built one.',d:'His paper imagined a simple machine reading symbols on a tape that could, in principle, compute anything computable. In WWII he worked on Enigma at {{bletchley|Bletchley Park}}. In 1950 he asked whether machines can think.',s:'Wikipedia: Alan Turing',n:[['ai','In 1950 Turing asked whether machines can think.'],['crypto','Turing\'s wartime work was all about breaking codes.'],['zero','Every computer runs on zeros and ones.']]},
octopus:{k:'octopus squid cephalopod',e:'🐙',t:'Octopuses',f:'An octopus has three hearts, blue blood, and about two thirds of its neurons in its arms.',d:'Two hearts serve the gills and one serves the body. The blood is blue because it uses copper-based {{haemocyanin|haemocyanin}} instead of iron. With most neurons in the arms, each arm can do a lot of its own thinking.',s:'Wikipedia: Octopus',n:[['ai','A very different kind of intelligence, spread through the arms.'],['dna','Octopuses edit their own RNA on a huge scale, remixing their genetic instructions.'],['eyes','Their eyes evolved separately from ours.']]},
dna:{k:'dna gene genetic',e:'🧬',t:'DNA',f:'Stretch the DNA from one human cell end to end and it is about two metres long.',d:'DNA is a chemical code written with four letters. Each cell packs about two metres of it by coiling it around proteins. Reading it lets scientists trace stories like where cats came from.',s:'Wikipedia: DNA',n:[['info','DNA is nature\'s way of storing information.'],['octopus','Some of the strangest DNA tricks belong to octopuses.'],['fungi','Fungi are closer cousins to animals than to plants, and DNA proved it.']]},
ai:{k:'ai artificial intelligence robot',e:'🤖',t:'Artificial intelligence',f:'In 1950 Turing proposed swapping "can machines think?" for a party game: could you tell a machine from a person by text alone?',d:'Turing\'s "{{imitation|imitation game}}" became the famous Turing test. AI has swung between big hype and quiet "{{winter|winters}}" since. What "thinking" should even mean is still argued over.',s:'Wikipedia: Turing test',n:[['octopus','Octopuses show minds can be built in very different ways.'],['info','Machines and minds both come down to processing information.'],['frank','Long before AI, one novel asked what happens when we build a mind.']]}
,bees:{k:'bee honey',e:'🐝',t:'Honeybees',f:'A honeybee tells its hive-mates where flowers are by dancing: the angle of the waggle points the way, and its length gives the distance.',d:'The waggle dance was decoded by {{vonfrisch|Karl von Frisch}}, who won a Nobel Prize for it in 1973. Bees also use the sun as a compass, and can find it on cloudy days by sensing polarised light.',s:'Wikipedia: Waggle dance',n:[['nav','Bees navigate by the sun. So did human sailors.'],['lang','A dance that carries directions is a language, of sorts.'],['fungi','Bees and fungi both run huge cooperative networks.']]}
,nav:{k:'navigat wayfind compass',e:'🧭',t:'Wayfinding',f:'Polynesian navigators crossed thousands of miles of open Pacific using stars, swells and birds, with no instruments.',d:'Wayfinders read star paths, ocean swells, cloud shapes and the flight of land-nesting birds. In 1976 the canoe Hokule\'a sailed from Hawaii to Tahiti using traditional methods only.',s:'Wikipedia: Polynesian navigation',n:[['stars','Their compass was the night sky.'],['time','Ships also needed accurate clocks to find longitude.'],['bees','Bees are natural navigators too.']]}
,stars:{k:'star light',e:'⭐',t:'Starlight',f:'The nearest star system beyond the Sun is over four light-years away, so you see it as it was more than four years ago.',d:'Light takes about eight minutes to reach us from the Sun and years from other stars. Every telescope is a time machine, and some starlight left before humans existed.',s:'Wikipedia: Light-year',n:[['gold','Stars are where the heavy elements come from.'],['nav','Sailors turned stars into a map.'],['moon','Our nearest neighbour in the night sky is drifting away.']]}
,gold:{k:'gold',e:'🥇',t:'Gold',f:'A lot of Earth\'s gold was probably forged when neutron stars collided.',d:'In 2017 astronomers saw two {{neutron|neutron stars}} merge and spotted signs of heavy elements, gold included, being made. Every gold ring is a souvenir of an ancient space crash.',s:'Wikipedia: Kilonova',n:[['stars','Stars and their explosions made the elements.'],['volcano','Volcanic plumbing helps concentrate gold into veins.'],['chocolate','In Aztec markets, cacao beans were money instead.']]}
,volcano:{k:'volcan lava eruption',e:'🌋',t:'Volcanoes',f:'After the 1815 eruption of Mount Tambora, 1816 became known as the Year Without a Summer.',d:'{{tambora|Tambora}}\'s ash and sulphur veiled the sky and cooled the planet, and crops failed across Europe and North America. That gloomy summer also helped inspire a famous novel.',s:'Wikipedia: Year Without a Summer',n:[['frank','A cold, dark summer led to a monster story.'],['gold','Volcanic plumbing helps concentrate gold into veins.'],['fungi','Fungi are among the first things to move into fresh volcanic ground.']]}
,frank:{k:'frankenstein shelley',e:'📖',t:'Frankenstein',f:'Mary Shelley began Frankenstein at 18, during a ghost-story contest on a rainy holiday in 1816.',d:'Lord Byron challenged the group at Lake Geneva to write ghost stories. Shelley\'s tale asked what happens when science outruns responsibility, and it is often called an early work of science fiction.',s:'Wikipedia: Frankenstein',n:[['ai','Frankenstein is about building a mind. So is AI.'],['elec','Experiments with electricity and life haunted the book.'],['volcano','That rainy summer was caused by a volcano.']]}
,elec:{k:'electric galvani',e:'⚡',t:'Animal electricity',f:'In the 1780s Luigi Galvani made dead frogs\' legs twitch with electricity, and set off a great argument about life itself.',d:'Galvani believed animals carried their own "animal electricity". Alessandro Volta disagreed and, while proving it, invented the battery. Both were partly right: nerves really do run on electrical signals.',s:'Wikipedia: Luigi Galvani',n:[['octopus','Octopus arms run on the same kind of nerve signals.'],['ai','Artificial neural networks were loosely inspired by nerve cells.'],['frank','Galvani\'s twitching frogs haunted a famous novel.']]}

,zero:{k:'zero',e:'0️⃣',t:'The number zero',f:'One of the earliest known zero symbols, a simple dot, sits in the Bakhshali manuscript, which carbon dating puts centuries earlier than once thought.',d:'Zero began as a placeholder in several cultures. Indian mathematicians such as {{brahmagupta|Brahmagupta}}, around 628 CE, wrote rules for using zero as a number in its own right. Without it, computing, which is all zeros and ones, would not exist.',s:'Wikipedia: 0',n:[['info','Bits are just zeros and ones.'],['writing','Zero is a writing invention too.'],['time','Zero also gives us "midnight" and year zero puzzles.']]}

elephant:['Elephants rumble to each other over long distances, in sounds too low for us to hear.','An elephant’s trunk has tens of thousands of muscle bundles.'],
birdnav:['Arctic terns migrate from the Arctic to Antarctica and back every year.','Some birds can fly for days without landing.'],
cooking:['Evidence of controlled fire goes back hundreds of thousands of years.','Cooking makes some foods easier to digest and some nutrients easier to absorb.'],
rainbow:['In a double rainbow, the outer arc has its colours in reverse order.','No two people see exactly the same rainbow, because it depends on where you stand.'],
glass:['Glass is made mostly from melted sand.','Roman glassmakers were already making colourful glass vessels around two thousand years ago.'],
chili:['Capsaicin heat is measured on the Scoville scale.','Chillies come originally from the Americas.'],
gps:['GPS needs signals from at least four satellites to work out where you are.','About thirty GPS satellites orbit roughly 20,000 kilometres up.'],
honey:['Bees fan honey with their wings to thicken it.','Bees turn nectar into honey by passing it mouth to mouth.'],
ants:['Some ant colonies have millions of ants.','Ants can carry many times their own body weight.'],
microbes:['Your gut microbes help make some vitamins.','Most of the microbes on you are harmless or helpful.'],
colour:['The blue morpho butterfly looks blue because of tiny ridges on its wings, not pigment.','Peacock feathers also get much of their colour from structure.'],
saturn:['Saturn’s rings are mostly ice, from dust specks to boulders.','A day on Saturn is about ten and a half hours long.']};
const bits=id=>M[id]?'<p class="src"><b>More weird bits 🥕</b></p><ul class="bits">'+M[id].map(x=>'<li>'+x+'</li>').join('')+'</ul>':'';
const HOP=['Ooh, good one. I smell carrots. Pick a tunnel!','Wait until you see where this goes...','We are already far from where we started. Keep digging!','Hop number four. You are officially a Rabbithole person.','I only meant to look up one thing too.'];
const S={trail:[],carrots:0,seen:new Set(),deep:false,dug:new Set(),lives:3,fox:true,asked:new Set(),met:false,ft:null,ct:null,q:null};
const $=id=>document.getElementById(id);
function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toast.h);toast.h=setTimeout(()=>t.hidden=true,3200)}
function start(msg){
  S.trail=[];$('sheet').hidden=true;clearTimeout(S.ft);
  $('app').innerHTML=`<div class="hero"><div class="bun" aria-hidden="true">🐇</div>
  <h1>Ask one thing.<br>Fall down five.</h1>
  <p class="sub" id="msg"></p>
  <form id="f"><input id="q" placeholder="What are you curious about?" autocomplete="off" aria-label="Search"><button class="go">Down we go</button></form>
  <div class="chips">${['cats','volcanoes','octopuses','cheese','rainbows','bats'].map(c=>`<button class="chip" data-q="${c}">${c}</button>`).join('')}</div></div>`;
  $('msg').textContent=msg||MODE_INFO[MODE.mode].note;
  $('f').onsubmit=e=>{e.preventDefault();go($('q').value)};
}
function find(q){q=q.toLowerCase();return Object.keys(N).find(id=>N[id].k.split(' ').some(w=>w.length>3?q.includes(w):new RegExp('\\b'+w+'(s|es)?\\b').test(q)))}
function go(q){q=(q||'').trim();if(!q)return;if(rude(q))return start(nextRude());const id=find(q);if(!id)return unknown(q);S.trail=[id];S.deep=false;render()}
function options(){
  const cur=S.trail[S.trail.length-1];
  let o=N[cur].n.filter(([i])=>!S.trail.includes(i));o.sort(()=>Math.random()-.5);
  Object.keys(N).filter(i=>!S.trail.includes(i)&&!o.some(x=>x[0]===i)).forEach(i=>{if(o.length<3)o.push([i,'Wildcard tunnel: Bunny\'s nose says dig here.'])});
  return o.slice(0,3);
}
function render(keep){
  const id=S.trail[S.trail.length-1],n=N[id],hops=S.trail.length-1;
  $('carrots').hidden=false;$('carrots').textContent='🥕 '+S.carrots;
  const trail=S.trail.map(i=>`<b>${N[i].e} ${N[i].t}</b>`).join(' 🥕 ');
  $('app').innerHTML=`<div class="bubble"><span aria-hidden="true">🐇</span><span>${HOP[Math.min(hops,HOP.length-1)]}</span></div>
  <div class="trail" aria-label="Your journey so far">${trail}</div>
  <section class="reveal"><div class="big" aria-hidden="true">${n.e}</div><h2>${n.t}</h2><p class="hook">${lk(modeHook(id,n))}</p><div class="acts2">${S.deep?'':'<button class="deeper" data-deeper="1">Dig deeper 🕳️</button>'}<a class="wiki" href="${wiki(n)}" target="_blank" rel="noopener noreferrer">📖 Read more ↗</a></div>${S.deep?`<div class="more"><p>${lk(modeFact(id,n))}</p>${bits(id)}<p class="src">Source: ${n.s}</p></div>`:''}${hops===0?'<p class="src">Psst: the wiggly-underlined words are tunnels too. Tap one!</p>':''}</section>
  <h3 class="next">🐇 Where next?</h3>
  ${options().map(([i,w])=>`<article class="card"><h3>${N[i].e} ${N[i].t}</h3>
  <p class="hook">${lk(modeHook(i,N[i]))}</p><p class="why"><b>Why this hop?</b> ${w}</p>
  <button class="dig" data-go="${i}">Go down this hole →</button></article>`).join('')}`;
  if(!keep)window.scrollTo({top:0,behavior:'smooth'});foxSchedule(keep);
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.mode){MODE.mode=b.dataset.mode;updateModeUI();start();return}
  if(b.dataset.print){printable(b.dataset.print,b.dataset.id);return}
  if(b.dataset.a)return done(b.dataset.a===S.q,false);
  if(b.dataset.fox==='close'){$('fox').hidden=true;return}
  if(b.dataset.fox==='reset'){$('fox').hidden=true;S.lives=3;S.carrots=0;S.asked.clear();$('carrots').textContent='🥕 0';$('lives').textContent='🐇🐇🐇';return start()}
  if(b.id==='foxbtn'){S.fox=!S.fox;b.textContent=S.fox?'🦊 on':'🦊 off';b.setAttribute('aria-pressed',S.fox);if(!S.fox)clearTimeout(S.ft);return}
  if(b.dataset.close)$('sheet').hidden=true;
  if(b.dataset.w)return openWord(b.dataset.w);
  if(b.id==='home')return start();
  if(b.dataset.q)return go(b.dataset.q);
  if(b.dataset.deeper){S.deep=true;const c=S.trail[S.trail.length-1];if(!S.dug.has(c)){S.dug.add(c);S.carrots++}return render(1)}
  if(b.dataset.go){S.trail.push(b.dataset.go);S.carrots++;S.deep=false;render();
    if(S.trail.length===4)toast('🥕 Past the three-hop test! The tunnel has you.');}
});

const INTRO=['Well, well. A tasty-looking bunny.','Pop quiz, fluffball. Wrong answers are delicious.','Psst. Been paying attention? I hope not.','Nice trail you left. Very easy to follow.'];
const FIRST='Hello, little bunny. I am Fox. Answer right or I eat you. (Shoo me with the 🦊 button up top if I am too much.)';
const WIN=['Hmph. Lucky bunny.','Curses! Foiled by facts.','Fine. You may live. For now.'];
const LOSE=['CHOMP! Tastes like carrots.','Nom nom nom. Not paying attention is delicious.','Gulp! Better luck next life.'];
const pick1=a=>a[Math.floor(Math.random()*a.length)];
const sent=id=>{const t=String(H[id]||N[id].f).replace(/\{\{[^|]+\|([^}]+)\}\}/g,'$1');const m=t.match(/^.*?[.!?](?=\s)/);return m?m[0]:t};
function foxSchedule(keep){
  $('lives').hidden=false;$('lives').textContent='🐇'.repeat(Math.max(S.lives,0))||'💀';
  if(keep)return;clearTimeout(S.ft);
  if(!S.fox||S.trail.length<2||Math.random()<.1)return;
  S.ft=setTimeout(attack,3000+Math.random()*5000);
}
function attack(){
  if(!S.fox||!S.trail.length)return;
  if(!$('sheet').hidden){S.ft=setTimeout(attack,3000);return}
  let pool=S.trail.filter(i=>!S.asked.has(i));if(!pool.length){S.asked.clear();pool=S.trail.slice()}
  const id=pick1(pool);S.asked.add(id);S.q=id;
  const others=Object.keys(N).filter(i=>i!==id).sort(()=>Math.random()-.5).slice(0,2);
  const opts=[id,...others].sort(()=>Math.random()-.5);
  const say=S.met?pick1(INTRO):FIRST;S.met=true;
  $('fox').innerHTML=`<div class="fbox"><div class="face">🦊</div><p class="fsay">${say}</p><h3 id="fq">Which of these did you read under ${N[id].e} ${N[id].t}?</h3><div class="bar"><i id="bar"></i></div>${opts.map(o=>`<button class="opt" data-a="${o}">${sent(o)}</button>`).join('')}</div>`;
  $('fox').hidden=false;
  const bar=$('bar');requestAnimationFrame(()=>requestAnimationFrame(()=>{bar.style.transition='width 20s linear';bar.style.width='0'}));
  clearTimeout(S.ct);S.ct=setTimeout(()=>done(false,true),20000);
  $('fox').querySelector('.opt').focus();
}
function done(ok,late){
  clearTimeout(S.ct);let h;
  if(ok){S.carrots+=2;h=`<div class="face">🦊💢</div><p class="fsay">${pick1(WIN)}</p><p class="fsay">Correct! +2 🥕</p><button class="dig" data-fox="close">Phew. Back to the tunnels</button>`}
  else{S.lives--;S.carrots=Math.max(0,S.carrots-2);const over=S.lives<=0;
    h=`<div class="face">${over?'💀':'🦊<span class="nom">nom nom nom</span>'}</div><p class="fsay">${late?'Too slow! ':''}${pick1(LOSE)}</p><p>The right one: ${sent(S.q)}</p>${over?'<p class="fsay">Eaten three times. Back to the burrow with you.</p><button class="dig" data-fox="reset">Dig again</button>':'<p class="fsay">−2 🥕 and a life lost</p><button class="dig" data-fox="close">Ouch. Carry on</button>'}`}
  $('fox').innerHTML=`<div class="fbox">${h}</div>`;
  $('carrots').hidden=false;$('carrots').textContent='🥕 '+S.carrots;$('lives').textContent='🐇'.repeat(Math.max(S.lives,0))||'💀';
  $('fox').querySelector('button').focus();
}
document.addEventListener('click',e=>{if(e.target.closest('a.wiki'))S.away=true});
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&S.away){S.away=false;S.carrots++;$('carrots').hidden=false;$('carrots').textContent='🥕 '+S.carrots;toast('🐇 Welcome back! Your trail is right where you left it. +1 🥕')}});
updateModeUI();
start();
</script>
</body>
</html>
